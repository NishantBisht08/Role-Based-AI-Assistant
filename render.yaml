services:
  # 1. FastAPI Backend
  - type: web
    name: finsolve-backend
    env: python
    buildCommand: "pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt --no-cache-dir"
    startCommand: "python init_db.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CLIENT_URL
        fromService:
          type: web
          name: finsolve-frontend
          property: url

  # 2. React Vite Frontend
  - type: web
    name: finsolve-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: finsolve-backend
          property: url
