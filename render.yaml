databases:
  # 1. PostgreSQL Database
  - name: rbac-db
    databaseName: rbac_db
    user: app_user
    plan: free

services:
  # 2. FastAPI Backend
  - type: web
    name: finsolve-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python init_db.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rbac-db
          property: connectionString
      - key: DATA_DIR
        value: /data
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: chroma-data
      mountPath: /data
      sizeGB: 1

  # 3. Streamlit Frontend
  - type: web
    name: finsolve-frontend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/frontend_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: finsolve-backend
          property: host
      - key: PYTHON_VERSION
        value: 3.11.0
